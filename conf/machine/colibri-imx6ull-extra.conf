# Our custom device tree name
DIAMOND_DEVICETREE_ROOT = "imx6ull-colibri-diamond-sic"
DIAMOND_DEVICETREE_SRC = "${DIAMOND_DEVICETREE_ROOT}.dts"
DIAMOND_DEVICETREE_BIN = "${DIAMOND_DEVICETREE_ROOT}.dtb"

KERNEL_DEVICETREE:append = " nxp/imx/${DIAMOND_DEVICETREE_BIN}"

# These are defined in layers/meta-toradex-nxp/conf/machine/include/colibri-imx6ull.inc
# Remove as we only ever want our one custom dtb built.
KERNEL_DEVICETREE:remove:colibri-imx6ull = " \
   ${KERNEL_DTB_PREFIX}imx6ull-colibri-aster.dtb \
   ${KERNEL_DTB_PREFIX}imx6ull-colibri-eval-v3.dtb \
   ${KERNEL_DTB_PREFIX}imx6ull-colibri-iris.dtb \
   ${KERNEL_DTB_PREFIX}imx6ull-colibri-iris-v2.dtb \
   ${KERNEL_DTB_PREFIX}imx6ull-colibri-wifi-aster.dtb \
   ${KERNEL_DTB_PREFIX}imx6ull-colibri-wifi-eval-v3.dtb \
   ${KERNEL_DTB_PREFIX}imx6ull-colibri-wifi-iris.dtb \
   ${KERNEL_DTB_PREFIX}imx6ull-colibri-wifi-iris-v2.dtb \
   imx6ull-colibri-eval-v3.dtb \
   imx6ull-colibri-wifi-eval-v3.dtb \
"
# We don't need any of these modules that are by default included in the "minimal" image
MACHINE_FEATURES:remove ="usbgadget usbhost alsa touchscreen screen screen usbgadget usbhost ext2 alsa touchscreen wifi bluetooth 3g "
# Nor do we need any of these features
DISTRO_FEATURES:remove = "alsa bluetooth debuginfod ext2 pcmcia usbgadget usbhost wifi zeroconf 3g nfc x11 seccomp opengl multiarch wayland vulkan pam tpm2 opengl wayland x11 polkit pulseaudio gobject-introspection-data"

# These parameters were discovered by either the `nand` or `ubi` commands in the Uboot environment of an imx6ull.
# Note the -e parameter value was "131072", but when trying to load the OS a kernel panic triggered, due to the
# system saying the actual size of the block was "126976".
MKUBIFS_ARGS = "-m 2048 -e 126976 -c 4057"


UBOOT_BINARY:colibri-imx6ull = "u-boot.imx"
